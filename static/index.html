<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delta Fare Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="bar">
    <form id="search" autocomplete="off">
      <div class="brand">Delta Fare Map</div>
      <label class="field origin">
        <span>From</span>
        <input id="origin" name="origin" maxlength="40" required>
        <ul id="ac" class="ac" hidden></ul>
      </label>
      <label class="field"><span>Depart</span><input id="depart" type="date" required></label>
      <label class="field"><span>Return</span><input id="ret" type="date" required></label>
      <button id="go" type="submit">Search</button>
      <div class="filters">
        <label class="field slider"><span>Max price <b id="maxv">any</b></span>
          <input id="maxprice" type="range" min="0" max="100" value="100"></label>
        <label class="field"><span>Stops</span>
          <select id="stops">
            <option value="any">Any</option>
            <option value="1">≤ 1 stop</option>
            <option value="0">Nonstop</option>
          </select></label>
        <div id="chips" class="chips"></div>
      </div>
      <div id="quota" class="quota" title="SerpApi searches remaining (from the free Account API)"></div>
    </form>
    <div id="status" class="status"></div>
  </header>

  <main>
    <div id="map"></div>
    <div id="legend" class="legend" hidden></div>
    <details id="listwrap" class="listwrap">
      <summary>List view <span id="count"></span></summary>
      <div class="listscroll">
        <table id="list">
          <thead><tr>
            <th data-k="city">City</th><th data-k="country">Country</th><th data-k="code">Airport</th>
            <th data-k="price" class="num">Fare</th><th data-k="stops" class="num">Stops</th>
            <th data-k="minutes" class="num">Travel time</th><th data-k="region">Region</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </main>

  <aside id="panel" class="panel" aria-hidden="true">
    <button id="close" class="close" aria-label="Close">×</button>
    <div id="panelbody"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
